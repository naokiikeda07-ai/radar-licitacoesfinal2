name: Coletar licitações

on:
  schedule:
    # 07h, 12h e 18h no horário de Brasília (UTC-3)
    - cron: "0 10,15,21 * * *"
  workflow_dispatch: # permite rodar manualmente pela aba Actions

permissions:
  contents: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Coletar licitações no PNCP
        env:
          DIAS_A_FRENTE: "30"
        run: python -u coletor.py

      - name: Publicar licitacoes.json
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add licitacoes.json
          git diff --staged --quiet || (git commit -m "Atualiza licitações" && git push)
